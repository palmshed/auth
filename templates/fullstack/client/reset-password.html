<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palmshed auth - reset password</title>
  <style>
    :root {
      --bg: #080909; --surface: #0e1010; --text: #e1e2e2; --text-secondary: #8f9191;
      --accent: #91AAA6; --border: rgba(255,255,255,0.04);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    main { max-width: 400px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: 0.5rem; }
    .sub { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.375rem; }
    input[type=password] {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.625rem 0.75rem; color: var(--text); font-size: 0.9375rem; font-family: var(--font);
    }
    input:focus { outline: 1.5px solid var(--accent); outline-offset: 1px; }
    .field { margin-bottom: 1.25rem; }
    button {
      width: 100%; background: var(--accent); color: #080909; border: none; border-radius: 6px;
      padding: 0.7rem; font-size: 0.9375rem; font-weight: 500; cursor: pointer; font-family: var(--font);
    }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: var(--accent); text-decoration: none; }
    .msg { font-size: 0.875rem; margin-bottom: 1rem; min-height: 1.2rem; }
    .msg.error { color: #d98a8a; }
    .msg.ok { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Reset password</h1>
    <p class="sub" id="hint"></p>
    <div class="msg" id="msg"></div>

    <form id="form" method="post">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" id="submit">Set new password</button>
    </form>
  </main>

  <script type="module">
    import { AuthClient } from "./assets/auth-client.js";

    var client = new AuthClient({ baseUrl: window.location.origin });
    var form = document.getElementById('form');
    var msg = document.getElementById('msg');
    var submit = document.getElementById('submit');
    var password = document.getElementById('password');
    var confirm = document.getElementById('confirm');
    var hint = document.getElementById('hint');
    var token = new URLSearchParams(window.location.search).get('token') || '';

    function show(text, kind) { msg.textContent = text; msg.className = 'msg ' + (kind || ''); }

    if (!token) {
      show('This reset link is missing a token. Request a new reset from the sign-in page.', 'error');
      form.style.display = 'none';
    } else {
      hint.textContent = 'Enter a new password of at least 8 characters.';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (password.value.length < 8) { show('Password must be at least 8 characters.', 'error'); return; }
      if (password.value !== confirm.value) { show('Passwords do not match.', 'error'); return; }
      submit.disabled = true;
      client.resetPassword(token, password.value)
        .then(function (res) {
          if (res.ok) { show('Password reset. You can now sign in.', 'ok'); form.style.display = 'none'; }
          else show(res.error || 'Could not reset the password.', 'error');
        })
        .finally(function () { submit.disabled = false; });
    });
  </script>
</body>
</html>
