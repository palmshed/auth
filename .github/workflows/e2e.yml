name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Deploy preview deployment (CAPTCHA_PROVIDER=none)
        id: deploy
        working-directory: apps/server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx vercel pull --yes --environment=preview \
            --token="$VERCEL_TOKEN" --org="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
          npx vercel build --yes --token="$VERCEL_TOKEN" \
            --org="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
          PREVIEW_URL=$(npx vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" \
            --org="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" \
            --env CAPTCHA_PROVIDER=none \
            --env ALLOWED_ORIGIN="https://palmshed.github.io" \
            --env DATABASE_URL="$DATABASE_URL" | tail -n 1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Run E2E suite against the preview deployment
        env:
          BASE_URL: "https://palmshed.github.io"
          API_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          CAPTCHA_PROVIDER: "none"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
